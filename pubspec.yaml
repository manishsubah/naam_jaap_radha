name: naam_jaap
description: "JaapMala - a devotional companion for daily naam jaap and reflections."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  path_provider: ^2.1.6
  uuid: ^4.6.0
  intl: ^0.20.3
  google_fonts: ^9.0.0
  flutter_animate: ^4.5.2
  fl_chart: ^1.2.0
  table_calendar: ^3.3.0
  record: ^7.1.2
  just_audio: ^0.10.6
  speech_to_text: ^7.5.0
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#E65100"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 23

flutter_native_splash:
  color: "#FFF8E7"
  color_dark: "#1C1126"
  image: assets/icon/splash_icon.png
  android_12:
    color: "#FFF8E7"
    color_dark: "#1C1126"
    image: assets/icon/app_icon_foreground.png
    icon_background_color: "#E65100"
    icon_background_color_dark: "#E65100"
  web: false
